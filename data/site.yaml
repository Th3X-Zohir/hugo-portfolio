projects:
  - name: E-Family Court
    tag: National e-Judiciary Platform
    status: LIVE
    period: 06/2025 — Present
    url: https://efamilycourt.judiciary.gov.bd/
    role: Full-Stack Developer
    reel: court
    blurb: >-
      End-to-end digital case-filing system for the Family Courts of Dhaka and
      Chattogram. Citizens file cases online, track progress, pay securely, and
      get SMS/email updates. Judges manage hearings and issue orders; lawyers
      submit documents; court staff verify and generate reports.
    highlights:
      - Online case filing with secure payments & status tracking
      - Role-based portals for judges, lawyers, citizens & staff
      - Automated SMS / email notifications & PDF order generation
    stack: [Laravel, PHP, MS SQL Server, JavaScript, AJAX, JWT, dompdf]

  - name: Routine Scrapper
    tag: University Scheduling Automation
    status: LIVE
    period: Web + Android
    url: https://routine.zohirrayhan.me/
    role: Creator & Maintainer
    reel: schedule
    blurb: >-
      A centralized automation platform for Daffodil International University.
      Scrapes official routines, builds the CSE database, and precomputes batch,
      teacher, and room-wise schedules — with real-time room booking and push
      notifications.
    highlights:
      - Scrapes official routines & precomputes batch/teacher/room schedules
      - Real-time room availability & booking over SocketIO
      - Companion Android app with FCM push & background sync
    stack: [Python, Flask, SocketIO, Firebase FCM, pandas, ReportLab, Java / Android]

  - name: Student Hub
    tag: Official Student Management System
    status: LIVE
    period: Office of Student Affairs · DIU
    url: https://studentshub.daffodilvarsity.edu.bd/team
    role: Full-Stack Developer
    reel: dashboard
    blurb: >-
      The official university platform automating student services —
      orientation sign-up with digital food tokens, dedicated club-management
      panels, and a dynamic course-enrollment engine synced from the GoEdu
      platform.
    highlights:
      - "Orientation module: sign-up, digital food tokens & event preferences"
      - "Per-club panels: members, certificates, payments & fund administration"
      - Dynamic course enrollment synced from GoEdu
    stack: [Laravel, Blade, MySQL, JavaScript, AJAX, JWT]

  - name: Blood Bridge
    tag: Blood Donor Finder Platform
    status: LIVE
    period: Side Project
    url: https://blood.shafinahmed.site/find-donor/dummy
    role: Full-Stack Developer
    reel: map
    blurb: >-
      A geolocation-based platform that connects blood donors and seekers in
      real time — interactive maps filter donors by group, location and radius,
      with live ETA tracking and a community feed for urgent appeals.
    highlights:
      - Real-time donor location sharing with ETA & route
      - Map search filtered by blood group, location & 5–20 km radius
      - Community feed for urgent blood requests
    stack: [Python, Flask, Leaflet.js, MySQL, JavaScript]

