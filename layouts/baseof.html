<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body class="loading">
  {{ partial "chrome/loader.html" . }}

  <div class="grain"></div>
  <canvas class="aurora" aria-hidden="true"></canvas>
  <div class="sbar"></div>

  <div class="cursor" aria-hidden="true">
    <span class="dot"></span>
    <span class="reticle"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></span>
    <span class="co">0000,0000</span>
    <span class="lbl"></span>
  </div>

  {{ partial "chrome/nav.html" . }}
  {{ partial "chrome/rail.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "chrome/footer.html" . }}
  {{ partial "chrome/palette.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
