<section id="credentials" class="wrap section pad">
  <div class="shead">
    <div class="meta"><span class="no">09</span><span>/ credentials</span><span class="ln"></span><span>certifications · awards</span></div>
    <h2 class="mask"><span>Certified &amp; recognized.</span></h2>
  </div>
  <div class="creds creds-2">
    <div data-rv>
      <div class="col-head">Certifications</div>
      {{- range .certifications }}
        <div class="icard"><h4>{{ .title }}</h4><div class="sub"><span>{{ .by }}</span></div></div>
      {{- end }}
    </div>
    <div data-rv data-d="1">
      <div class="col-head">Achievements</div>
      {{- range .achievements }}
        <div class="icard"><h4>{{ .title }}</h4><div class="sub"><span>{{ .by }}</span></div></div>
      {{- end }}
    </div>
  </div>
</section>
