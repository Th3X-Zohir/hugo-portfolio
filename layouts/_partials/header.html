<header class="site-head">
  <a class="brand" href="{{ "/" | relURL }}">
    <span class="brand-mark">ZR</span>
    <span class="brand-name">{{ site.Params.name }}</span>
  </a>
  <nav aria-label="Main">
    {{ range site.Menus.main }}
      {{- $active := and $.IsPage (or ($.IsDescendant .Page) (eq $.Page .Page)) }}
      <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button id="theme-toggle" type="button" aria-label="Toggle colour theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"></path>
      </svg>
    </button>
  </nav>
</header>
