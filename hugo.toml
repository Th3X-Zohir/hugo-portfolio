baseURL = "https://th3x-zohir.github.io/hugo-portfolio/"
locale = "en-us"
title = "Zohir Rayhan"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  name = "Zohir Rayhan"
  tagline = "Tech Lead · DevOps & DevSecOps Engineer"
  description = "Zohir Rayhan — Tech Lead, DevOps & DevSecOps Engineer and Full-Stack Developer in Dhaka, Bangladesh. An editorial engineering portfolio."
  github = "https://github.com/Th3X-Zohir"
  keywords = ["Zohir Rayhan", "Tech Lead", "DevOps Engineer", "DevSecOps Engineer", "Full-Stack Developer", "Laravel", "Python", "Linux", "CI/CD", "Bangladesh Portfolio"]

